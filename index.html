<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbre de famille">
<title>Arbre de famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet green registry. One top bar with three tabs, a pannable tree canvas, a side drawer for each person's sheet. */
:root{
  --paper:#EDF0EA; --surface:#FBFCF9; --ink:#1C2B24; --muted:#5E6E65; --line:#CBD3CA;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --gold:#8F6510; --gold-bg:#F4E7C6;
  --m:#3F6C8F; --f:#A2557A; --u:#7A8079; --danger:#A33A2B;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(28,43,36,.08),0 6px 20px rgba(28,43,36,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A17; --surface:#1D2521; --ink:#E6ECE6; --muted:#9BAAA0; --line:#34403A;
    --accent:#6FBF98; --accent-ink:#0F1512; --gold:#E2B55A; --gold-bg:#3A3017;
    --m:#7FB0D6; --f:#D58FB2; --u:#9AA39C; --danger:#E0786A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A17; --surface:#1D2521; --ink:#E6ECE6; --muted:#9BAAA0; --line:#34403A;
  --accent:#6FBF98; --accent-ink:#0F1512; --gold:#E2B55A; --gold-bg:#3A3017;
  --m:#7FB0D6; --f:#D58FB2; --u:#9AA39C; --danger:#E0786A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 17px/1.45 var(--body);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:650;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.small{min-height:36px;padding:0 12px;font-size:15px}
.btn.icon{width:44px;padding:0;font-size:20px}
input[type=text],input[type=number],input[type=search],select,textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
textarea{min-height:110px;resize:vertical}
label{font-size:14px;color:var(--muted);font-weight:500;display:block;margin-bottom:4px}

header.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:24px;letter-spacing:-.01em}
nav.tabs{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:12px}
nav.tabs button{min-height:40px;padding:0 16px;border:0;background:transparent;border-radius:9px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.status{font-size:14px;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--u)}
.status.ok .dot{background:var(--accent)} .status.warn{color:var(--gold);border-color:var(--gold)} .status.warn .dot{background:var(--gold)}
.status.bad{color:var(--danger);border-color:var(--danger)} .status.bad .dot{background:var(--danger)}
.banner{background:var(--gold-bg);color:var(--ink);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px;border-bottom:1px solid var(--line)}
.banner.bad{background:transparent;border:2px solid var(--danger);margin:8px 16px;border-radius:10px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px}
.toolbar .grow{flex:1;min-width:180px}
.toolbar select{width:auto}
.toolbar .lbl{font-size:14px;color:var(--muted)}

/* tree */
#viewport{flex:1;min-height:320px;position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
#viewport.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#world svg path{fill:none;stroke:var(--muted);stroke-width:1.5}
.card{position:absolute;width:176px;height:64px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--u);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card.M{border-left-color:var(--m)} .card.F{border-left-color:var(--f)}
.card.focus{border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.card .txt{min-width:0;flex:1;line-height:1.2}
.card .n1,.card .n2,.card .n3{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n1{font-size:14px} .card .n2{font-size:14px;font-weight:600} .card .n3{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--paper);color:var(--muted);display:grid;place-items:center;font-weight:600;font-size:14px;overflow:hidden;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.big{width:72px;height:72px;font-size:24px}
.sosa{position:absolute;top:-10px;right:8px;background:var(--gold-bg);color:var(--ink);border:1px solid var(--gold);font-size:11px;font-weight:600;line-height:16px;padding:0 6px;border-radius:8px;font-variant-numeric:tabular-nums}
.card.ghost{border:1.5px dashed var(--muted);border-left-width:1.5px;background:transparent;box-shadow:none;color:var(--muted);font-size:14px;justify-content:center;text-align:center}
.tag{display:inline-block;margin-left:8px;background:var(--gold-bg);border:1px solid var(--gold);font-size:12px;font-weight:600;padding:0 6px;border-radius:8px;vertical-align:middle;font-variant-numeric:tabular-nums}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.hint{position:absolute;left:12px;bottom:12px;font-size:13px;color:var(--muted);background:var(--surface);padding:6px 10px;border-radius:8px;border:1px solid var(--line);max-width:60%}

/* list */
.list{flex:1;overflow:auto;padding:0 16px 24px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.row:hover{border-color:var(--accent)}
.row .who{flex:2;min-width:0} .row .who b{font-weight:600}
.row .col{flex:1;min-width:0;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.row .who,.row .col{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.row .col.place{display:none}}
.empty{margin:auto;text-align:center;max-width:460px;padding:32px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty h2{font-size:30px}
.empty p{margin:0;color:var(--muted)}

/* backup tab */
.page{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;max-width:760px;width:100%;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:21px}
.panel p{margin:0;color:var(--muted);font-size:16px;max-width:65ch}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:20;display:none}
#scrim.on{display:block}
#sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:21;display:none;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line)}
#sheet.on{display:flex}
.sheet-head{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:22px;flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-head .sub{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);display:block}
.sheet-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:18px;display:flex;align-items:center;gap:8px}
.sec h3 .btn{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.dategrid{display:grid;grid-template-columns:1.25fr .7fr 1.3fr 1fr;gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--surface);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 8px;background:var(--paper)}
.chip .go{flex:1;min-width:0;text-align:left;border:0;background:transparent;min-height:40px;display:flex;align-items:center;gap:10px;padding:0}
.chip .go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .go small{color:var(--muted);font-variant-numeric:tabular-nums}
.none{color:var(--muted);font-size:15px;margin:0}
.union{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px}
.union .chip{border:0;padding:0;background:transparent}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--paper);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .star{position:absolute;left:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-size:11px;padding:1px 6px;border-radius:6px}

/* modal */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,16,13,.55)}
#modal.on{display:flex}
.dialog{background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);width:min(520px,100%);max-height:92%;display:flex;flex-direction:column;gap:12px;padding:18px;overflow:auto}
.dialog h2{font-size:21px}
.dialog p{margin:0;color:var(--muted)}
.dialog img.full{max-width:100%;max-height:55vh;object-fit:contain;border-radius:10px;align-self:center}
.pick{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.sep{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:50;display:none;max-width:90%;font-size:15px}
#toast.on{display:block}
@media (prefers-reduced-motion:no-preference){#world.anim{transition:transform .25s ease}}

.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
#btn-end{white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <h1>Arbre de famille</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="arbre" id="tab-arbre">Arbre</button>
    <button role="tab" data-tab="personnes" id="tab-personnes">Personnes</button>
    <button role="tab" data-tab="sauvegarde" id="tab-sauvegarde">Sauvegarde</button>
  </nav>
  <span style="flex:1"></span>
  <div class="status" id="status"><span class="dot"></span><span id="status-txt">Chargement…</span></div>
  <button class="btn" id="btn-end">Terminer la session</button>
</header>
<div id="banners"></div>
<main id="main"></main>
<div id="scrim"></div>
<aside id="sheet" aria-label="Fiche de la personne"></aside>
<div id="modal"></div>
<div id="toast" role="status"></div>
<input type="file" id="file-import" accept=".json,.ged,.txt,application/json,text/plain" hidden>
<input type="file" id="file-photo" accept="image/*" hidden>
<script>
"use strict";
/* ===== PURE (dates, GEDCOM) ===== */
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const GM=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function hasDate(d){return !!(d&&(d.y||d.m||d.d||d.t))}
function fmtDate(d){
  if(!hasDate(d))return "";
  if(!d.y&&!d.m&&d.t)return d.t;
  const q={abt:"vers ",bef:"avant ",aft:"après "}[d.q]||"";
  const parts=[];
  if(d.d&&d.m)parts.push(d.d===1?"1er":String(d.d));
  if(d.m)parts.push(MOIS[d.m-1]);
  if(d.y)parts.push(String(d.y));
  return q+parts.join(" ");
}
function dateKey(d){return d&&d.y?d.y*10000+(d.m||0)*100+(d.d||0):null}
function gedDate(d){
  if(!hasDate(d))return "";
  if(!d.y&&!d.m&&d.t)return d.t;
  let s={abt:"ABT ",bef:"BEF ",aft:"AFT "}[d.q]||"";
  if(d.d&&d.m)s+=d.d+" ";
  if(d.m)s+=GM[d.m-1]+" ";
  if(d.y)s+=d.y;
  return s.trim();
}
function parseGedDate(raw){
  if(!raw)return null;
  let s=raw.trim().toUpperCase(),q="";
  let m=s.match(/^(?:BET|FROM)\s+(.+?)\s+(?:AND|TO)\s+.+$/);
  if(m){s=m[1];q="abt"}
  m=s.match(/^(ABT|CAL|EST|BEF|AFT|FROM|TO)\.?\s+(.+)$/);
  if(m){q={ABT:"abt",CAL:"abt",EST:"abt",BEF:"bef",AFT:"aft",FROM:"aft",TO:"bef"}[m[1]];s=m[2]}
  m=s.match(/^(?:(\d{1,2})\s+)?(?:([A-Z]{3})[A-Z]*\.?\s+)?(\d{3,4})$/);
  if(!m)return {t:raw.trim()};
  const d={y:+m[3]};
  if(m[2]){const i=GM.indexOf(m[2]);if(i<0)return {t:raw.trim()};d.m=i+1;if(m[1])d.d=+m[1]}
  if(q)d.q=q;
  return d;
}
function gedExport(people,unions){
  const live=people.filter(p=>!p.deleted),byId=new Map(live.map(p=>[p.id,p]));
  const iid=new Map(live.map((p,i)=>[p.id,"@I"+(i+1)+"@"]));
  const fams=new Map(),key=(a,b)=>[a,b].filter(Boolean).sort().join("+");
  for(const u of unions){if(byId.has(u.a)&&byId.has(u.b))fams.set(key(u.a,u.b),{a:u.a,b:u.b,u,ch:[]})}
  for(const p of live){
    const pr=(p.parents||[]).filter(x=>byId.has(x)).slice(0,2);
    if(!pr.length)continue;
    const k=key(pr[0],pr[1]);
    if(!fams.has(k))fams.set(k,{a:pr[0],b:pr[1],ch:[]});
    fams.get(k).ch.push(p.id);
  }
  const fl=[...fams.values()];fl.forEach((f,i)=>{f.id="@F"+(i+1)+"@";
    const A=byId.get(f.a),B=f.b&&byId.get(f.b);
    if(B&&(A.sex==="F"&&B.sex!=="F"||B.sex==="M"&&A.sex!=="M")){const t=f.a;f.a=f.b;f.b=t}
  });
  const out=["0 HEAD","1 SOUR ArbreDeFamille","1 GEDC","2 VERS 5.5.1","2 FORM LINEAGE-LINKED","1 CHAR UTF-8","1 LANG French"];
  const clean=s=>String(s||"").replace(/[\r\n]+/g," ").trim();
  const ev=(tag,d,pl,force)=>{
    if(!hasDate(d)&&!pl&&!force)return;
    out.push("1 "+tag+(force&&!hasDate(d)&&!pl?" Y":""));
    if(hasDate(d))out.push("2 DATE "+gedDate(d));
    if(pl)out.push("2 PLAC "+clean(pl));
  };
  for(const p of live){
    out.push("0 "+iid.get(p.id)+" INDI");
    const gv=clean([p.given,p.otherGiven].filter(Boolean).join(" "));
    out.push("1 NAME "+gv+" /"+clean(p.surname)+"/");
    if(gv)out.push("2 GIVN "+gv);
    if(p.surname)out.push("2 SURN "+clean(p.surname));
    if(p.sex==="M"||p.sex==="F")out.push("1 SEX "+p.sex);
    ev("BIRT",p.birth,p.birthPlace,false);
    ev("DEAT",p.death,p.deathPlace,!!p.deceased);
    if(p.occupation)out.push("1 OCCU "+clean(p.occupation));
    if(p.notes){const ls=String(p.notes).split(/\r?\n/);out.push("1 NOTE "+ls[0]);for(let i=1;i<ls.length;i++)out.push("2 CONT "+ls[i])}
    for(const f of fl){if(f.ch.includes(p.id))out.push("1 FAMC "+f.id)}
    for(const f of fl){if(f.a===p.id||f.b===p.id)out.push("1 FAMS "+f.id)}
  }
  for(const f of fl){
    out.push("0 "+f.id+" FAM");
    const A=byId.get(f.a),B=f.b&&byId.get(f.b);
    if(B){out.push("1 HUSB "+iid.get(f.a));out.push("1 WIFE "+iid.get(f.b))}
    else out.push("1 "+(A.sex==="F"?"WIFE":"HUSB")+" "+iid.get(f.a));
    if(f.u&&(hasDate(f.u.date)||f.u.place)){out.push("1 MARR");if(hasDate(f.u.date))out.push("2 DATE "+gedDate(f.u.date));if(f.u.place)out.push("2 PLAC "+clean(f.u.place))}
    if(f.u&&(f.u.divorced||hasDate(f.u.divorce)||f.u.divorcePlace)){out.push("1 DIV"+(!hasDate(f.u.divorce)&&!f.u.divorcePlace?" Y":""));if(hasDate(f.u.divorce))out.push("2 DATE "+gedDate(f.u.divorce));if(f.u.divorcePlace)out.push("2 PLAC "+clean(f.u.divorcePlace))}
    for(const c of f.ch)out.push("1 CHIL "+iid.get(c));
  }
  out.push("0 TRLR");
  return out.join("\r\n")+"\r\n";
}
function gedParse(text,newId){
  const recs=[],stack=[];
  for(const line of text.replace(/^﻿/,"").split(/\r\n|\r|\n/)){
    const m=line.match(/^\s*(\d+)\s+(?:(@[^@]+@)\s+)?(\S+)(?: (.*))?$/);
    if(!m)continue;
    const lvl=+m[1],node={tag:m[3].toUpperCase(),xref:m[2]||"",val:m[4]||"",kids:[]};
    if(lvl===0){recs.push(node);stack.length=0;stack[0]=node;continue}
    const parent=stack[lvl-1];if(!parent)continue;
    if(node.tag==="CONT"){parent.val+="\n"+node.val;continue}
    if(node.tag==="CONC"){parent.val+=node.val;continue}
    parent.kids.push(node);stack[lvl]=node;stack.length=lvl+1;
  }
  const kid=(n,t)=>n.kids.find(k=>k.tag===t),kids=(n,t)=>n.kids.filter(k=>k.tag===t);
  const notes=new Map(recs.filter(r=>r.tag==="NOTE"&&r.xref).map(r=>[r.xref,r.val]));
  const map=new Map(),people=[],unions=[];
  for(const r of recs){
    if(r.tag!=="INDI")continue;
    const p={id:newId(),given:"",surname:"",sex:"",parents:[]};
    const nm=kid(r,"NAME");
    if(nm){
      const g=kid(nm,"GIVN"),s=kid(nm,"SURN"),mm=nm.val.match(/^([^/]*)\/([^/]*)\//);
      p.given=(g?g.val:mm?mm[1]:nm.val).trim();
      const gp=p.given.split(/\s+/);if(gp.length>1){p.given=gp[0];p.otherGiven=gp.slice(1).join(" ")}p.surname=(s?s.val:mm?mm[2]:"").trim();
    }
    const sx=kid(r,"SEX");if(sx&&/^[MF]/i.test(sx.val))p.sex=sx.val[0].toUpperCase();
    const b=kid(r,"BIRT")||kid(r,"BAPM")||kid(r,"CHR");

// arbre ascendant : uniquement les ancêtres, père toujours à gauche et mère toujours à droite
function layoutAsc(focus){

}

/* ---------- files: end of session, import, GEDCOM ---------- */
async function deliver(name,blob,type){
  const touch=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
  try{const file=new File([blob],name,{type});
    if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});return "shared"}catch(e){if(e&&e.name==="AbortError")return "cancel"}
    }}catch(e){}
  const url=URL.createObjectURL(blob),a=h("a",{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  return "downloaded";
}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"-"+z(d.getHours())+"h"+z(d.getMinutes())}
async function endSession(){
  if(!Object.keys(S.people).length){toast("L'arbre est vide, il n'y a rien à sauvegarder.");return}
  try{
    const data={format:"arbre-de-famille",version:2,exportedAt:Date.now(),people:Object.values(S.people),unions:Object.values(S.unions),
      meta:{rootId:S.meta.rootId,rootAt:S.meta.rootAt||0},media:await allMedia()};
    const name="arbre-de-famille-"+stamp()+".json";
    const r=await deliver(name,new Blob([JSON.stringify(data)],{type:"application/json"}),"application/json");
    if(r==="cancel"){toast("Envoi annulé : le fichier n'a pas été créé.");return}
    L.changed={};L.lastExportAt=Date.now();saveL();renderAll();
    ask("Fichier créé",r==="shared"
      ?["Le fichier "+name+" contient tout l'arbre et les photos.","Si vous l'avez envoyé par mail, vous le retrouverez sur l'autre appareil. Gardez ces mails : ce sont vos sauvegardes."]
      :["Le fichier "+name+" est dans votre dossier Téléchargements. Il contient tout l'arbre et les photos.","Envoyez-le-vous par mail en pièce jointe pour le reprendre sur l'autre appareil. Gardez ces mails : ce sont vos sauvegardes."],
      [{label:"Compris",value:true,cls:"primary"}]);
  }catch(e){toast("Le fichier n'a pas pu être créé. Réessayez.")}
}
$("btn-end").addEventListener("click",endSession);
function newer(rec,local){return !local||(rec.updatedAt||0)>(local.updatedAt||0)}
async function importSession(f){
  if(f.format!=="arbre-de-famille"||!Array.isArray(f.people))throw new Error("format");
  const localMedia=index(await allMedia());
  const takeP=f.people.filter(r=>r.id&&newer(r,S.people[r.id])),takeU=(f.unions||[]).filter(r=>r.id&&newer(r,S.unions[r.id])),takeM=(f.media||[]).filter(r=>r.id&&newer(r,localMedia[r.id]));
  const fp=index(f.people),fu=index(f.unions||[]);
  const mine=Object.values(S.people).filter(l=>!fp[l.id]||(l.updatedAt||0)>(fp[l.id].updatedAt||0)).length+Object.values(S.unions).filter(l=>!fu[l.id]||(l.updatedAt||0)>(fu[l.id].updatedAt||0)).length;
  const n=takeP.length+takeU.length+takeM.length;
  const when="Fichier créé le "+frDate(f.exportedAt,true)+".";
  if(!n){S.asked=true;renderBanners();await ask("Rien de nouveau dans ce fichier",[when,"Cet appareil a déjà tout ce qu'il contient"+(mine?", et "+mine+" éléments plus récents.":".")],[{label:"D'accord",value:true,cls:"primary"}]);return}
  const ok=await confirmBox("Charger ce fichier ?",[when,takeP.filter(live).length+" fiches et "+takeM.filter(m=>!m.purged).length+" images plus récentes vont être reprises.",
    mine?mine+" éléments modifiés sur cet appareil après ce fichier sont conservés tels quels.":"Rien n'est perdu sur cet appareil : seules les fiches plus récentes du fichier remplacent les vôtres."],"Charger");
  if(!ok)return;
  for(const r of takeP){S.people[r.id]=r;await put("people",r)}
  for(const r of takeU){S.unions[r.id]=r;await put("unions",r)}
  if(idb)for(const r of takeM)await put("media",r);
  if(f.meta&&f.meta.rootId&&(f.meta.rootAt||0)>=(S.meta.rootAt||0)){S.meta={...S.meta,rootId:f.meta.rootId,rootAt:f.meta.rootAt||0};await put("meta",S.meta,"app")}
  L.lastImportAt=Date.now();saveL();S.asked=true;S.needCenter=true;renderAll();
  toast("Fichier chargé : "+n+" éléments mis à jour.");
}
$("file-import").addEventListener("change",async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  try{
    const buf=await file.arrayBuffer();let text;
    try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(_){text=new TextDecoder("windows-1252").decode(buf)}
    if(text.trim().startsWith("{")){await importSession(JSON.parse(text));return}
    const r=gedParse(text,newId);
    if(!r.people.length)throw new Error("vide");
    if(!await confirmBox("Importer ce fichier GEDCOM ?",r.people.length+" personnes et "+r.unions.length+" unions vont être ajoutées à l'arbre. Les fiches existantes ne sont pas modifiées.","Importer"))return;
    const now=Date.now();
    for(const p of r.people){S.people[p.id]={...p,createdAt:now,updatedAt:now};await put("people",S.people[p.id]);L.changed["people/"+p.id]=1}
    for(const u of r.unions){u.updatedAt=now;S.unions[u.id]=u;await put("unions",u);L.changed["unions/"+u.id]=1}
    saveL();if(!P(S.meta.rootId))setRoot(r.people[0].id);
    S.asked=true;renderAll();toast(r.people.length+" personnes importées.");
  }catch(err){toast("Ce fichier n'a pas pu être lu. Choisissez un fichier arbre-de-famille…json ou un fichier .ged.")}
});
function buildBackup(m){m.append(h("div",{class:"page",id:"backup"}))}
function drawBackup(){
  const el=$("backup");if(!el)return;
  const n=allPeople().length,ch=Object.keys(L.changed).length,trash=Object.values(S.people).filter(p=>p.deleted&&!p.purged);
  el.replaceChildren(
    h("section",{class:"panel"},h("h2",{},"Passer d'un appareil à l'autre"),
      h("p",{},"L'arbre est enregistré sur chaque appareil séparément. Un fichier fait le lien entre les deux."),
      h("ol",{class:"steps"},
        h("li",{},h("b",{},"En fin de session"),", touchez « Terminer la session » et envoyez-vous le fichier par mail."),
        h("li",{},h("b",{},"Sur l'autre appareil"),", ouvrez le mail et enregistrez la pièce jointe (sur iPad : « Enregistrer dans Fichiers »)."),
        h("li",{},h("b",{},"Avant de reprendre"),", touchez « Charger un fichier » et choisissez cette pièce jointe.")),
      h("p",{},"En cas d'oubli, rien n'est écrasé : au chargement, chaque fiche garde sa version la plus récente, d'où qu'elle vienne."),
      h("div",{class:"actions"},h("button",{class:"btn primary",onclick:endSession},"Terminer la session"),h("button",{class:"btn",onclick:()=>$("file-import").click()},"Charger un fichier"))),
    h("section",{class:"panel"},h("h2",{},"État sur cet appareil"),
      h("p",{},n+(n>1?" personnes":" personne")+" dans l'arbre. "+(ch?ch+(ch>1?" modifications ne sont":" modification n'est")+" pas encore dans un fichier.":"Tout est dans le dernier fichier.")),
      h("p",{},(L.lastExportAt?"Dernier fichier créé ici le "+frDate(L.lastExportAt,true)+". ":"Aucun fichier créé depuis cet appareil. ")+(L.lastImportAt?"Dernier fichier chargé ici le "+frDate(L.lastImportAt,true)+".":""))),
    h("section",{class:"panel"},h("h2",{},"GEDCOM"),
      h("p",{},"Le format .ged est lu par Geneanet, Heredis, Gramps et les autres logiciels de généalogie. Il contient les personnes et leurs liens, sans les photos."),
      h("div",{class:"actions"},h("button",{class:"btn",onclick:async()=>{if(!n){toast("L'arbre est vide.");return}
        const r=await deliver("arbre-"+stamp()+".ged",new Blob([gedExport(Object.values(S.people).filter(p=>!p.purged),allUnions())],{type:"text/plain"}),"text/plain");if(r!=="cancel")toast("Fichier GEDCOM créé.")}},"Exporter en .ged"),
        h("button",{class:"btn",onclick:()=>$("file-import").click()},"Importer un .ged"))),
    h("section",{class:"panel"},h("h2",{},"Corbeille"),
      trash.length?trash.map(p=>h("div",{class:"chip"},h("span",{class:"go"},avatar(p),h("span",{},fullName(p))),
        h("button",{class:"btn small",onclick:()=>patchPerson(p.id,{deleted:undefined})},"Restaurer"),
        h("button",{class:"btn small danger",onclick:async()=>{if(await confirmBox("Supprimer définitivement ?","La fiche de "+fullName(p)+", ses liens et ses images seront effacés pour de bon, sur cet appareil puis sur l'autre au prochain chargement de fichier.","Supprimer définitivement",true))purgePerson(p.id)}},"Effacer")))
      :h("p",{},"La corbeille est vide. Les fiches supprimées y restent tant que vous ne les effacez pas.")));
}

/* ---------- boot ---------- */
window.addEventListener("beforeunload",e=>{if(Object.keys(L.changed).length){e.preventDefault();e.returnValue=""}});
async function boot(){
  try{const c=JSON.parse(localStorage.getItem(LS+"cache")||"null");if(c){S.people=c.people||{};S.unions=c.unions||{};S.meta=c.meta||{}}
    L={...L,...JSON.parse(localStorage.getItem(LS+"local")||"{}")};if(!L.changed)L.changed={};
    S.focus=localStorage.getItem(LS+"focus")||null;if(localStorage.getItem(LS+"mode")==="desc")S.mode="desc"}catch(e){}
  const t=location.hash.slice(1);showTab(["arbre","personnes","sauvegarde"].includes(t)?t:"arbre");
  try{
    idb=await idbOpen();
    const [pp,uu,meta]=await Promise.all([tx("people","readonly",s=>s.getAll()),tx("unions","readonly",s=>s.getAll()),tx("meta","readonly",s=>s.get("app"))]);
    if(pp.length||uu.length){
      // keep whichever copy of a record is newer between the database and the quick cache
      const merge=(db,cache)=>{const m=index(db);for(const r of Object.values(cache))if(newer(r,m[r.id]))m[r.id]=r;return m};
      S.people=merge(pp,S.people);S.unions=merge(uu,S.unions);S.meta=meta||S.meta;
    }else{for(const p of Object.values(S.people))await put("people",p);for(const u of Object.values(S.unions))await put("unions",u);if(S.meta.rootId)await put("meta",S.meta,"app")}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){idb=null;S.storeErr=true}
  S.ready=true;S.needCenter=true;renderAll();
}
boot();
</script>
